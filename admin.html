<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Donato App</title>
    
    <!-- Configuración para App Nativa en iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Donato App">
    <link rel="apple-touch-icon" href="assets/WhatsApp Image 2026-05-23 at 22.37.18.jpeg">
    <meta name="theme-color" content="#111111">

    <!-- Supabase & Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { barber: { dark: '#111111', gold: '#d4af37', gray: '#1f1f1f' }, danger: '#9e4242' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111111; color: white; -webkit-tap-highlight-color: transparent; }
        .app-card { background: #1f1f1f; border: 1px solid #333; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased pb-10">

    <!-- HEADER APP -->
    <header id="app-header" class="hidden bg-barber-dark pt-12 pb-4 px-5 sticky top-0 z-50 border-b border-gray-800 flex justify-between items-end backdrop-blur-md bg-opacity-90">
        <div>
            <p class="text-barber-gold text-[10px] tracking-[0.2em] font-bold uppercase mb-1">Nico Donatostudio</p>
            <h1 class="text-2xl font-serif">Panel de Control</h1>
        </div>
        <button onclick="window.logoutAdmin()" class="text-gray-400 hover:text-white text-xl p-2">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
    </header>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="hidden min-h-screen flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm app-card text-center py-10 shadow-2xl">
            <i class="fa-solid fa-scissors text-barber-gold text-4xl mb-4"></i>
            <h2 class="text-2xl font-serif mb-2">Donatostudio App</h2>
            <p class="text-xs text-gray-400 mb-8">Acceso exclusivo para barberos</p>
            
            <form onsubmit="window.processDirectLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-[10px] uppercase text-gray-400 tracking-wider mb-1 font-semibold">Correo</label>
                    <input type="email" id="login-email" required placeholder="donato@gmail.com"
                           class="w-full bg-black border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-barber-gold">
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-400 tracking-wider mb-1 font-semibold">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                           class="w-full bg-black border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-barber-gold">
                </div>
                <button type="submit" class="w-full bg-barber-gold text-black font-bold text-sm tracking-widest py-3.5 rounded-xl uppercase mt-4">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen" class="hidden px-4 pt-6 max-w-md mx-auto">
        
        <!-- ESTADÍSTICAS RÁPIDAS -->
        <div class="flex gap-4 mb-6">
            <div class="flex-1 app-card text-center py-4">
                <i class="fa-regular fa-calendar text-barber-gold text-xl mb-2"></i>
                <h3 id="stat-bookings" class="text-2xl font-bold">0</h3>
                <p class="text-[10px] text-gray-400 uppercase">Citas este mes</p>
            </div>
            <div class="flex-1 app-card text-center py-4" onclick="window.loadDataAndRender()" style="cursor:pointer">
                <i class="fa-solid fa-rotate text-barber-gold text-xl mb-2"></i>
                <h3 class="text-sm font-bold mt-3 uppercase text-gray-300">Actualizar</h3>
            </div>
        </div>

        <!-- REGISTRO DE CITAS -->
        <h2 class="text-lg font-serif mb-3 text-barber-gold border-b border-gray-800 pb-2"><i class="fa-solid fa-list mr-2"></i> Citas de Clientes</h2>
        
        <div class="mb-4">
            <input type="month" id="admin-month-filter" onchange="window.renderAdminBookingsTable()" 
                   class="w-full bg-barber-gray border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-barber-gold">
        </div>

        <div id="admin-bookings-list" class="space-y-3 mb-8"></div>

        <!-- CONFIGURADOR DE HORARIOS -->
        <h2 class="text-lg font-serif mb-3 text-barber-gold border-b border-gray-800 pb-2 mt-8"><i class="fa-regular fa-clock mr-2"></i> Disponibilidad Semanal</h2>
        
        <div class="app-card">
            <div class="flex gap-2 mb-4">
                <input type="month" id="admin-week-month" onchange="window.loadAndRenderWeeklySchedule()"
                       class="w-1/2 bg-black border border-gray-700 rounded-lg px-2 py-2 text-white text-xs focus:outline-none">
                <select id="admin-week-number" onchange="window.loadAndRenderWeeklySchedule()"
                        class="w-1/2 bg-black border border-gray-700 rounded-lg px-2 py-2 text-white text-xs focus:outline-none">
                    <option value="1">Semana 1</option>
                    <option value="2">Semana 2</option>
                    <option value="3">Semana 3</option>
                    <option value="4">Semana 4</option>
                    <option value="5">Semana 5</option>
                </select>
            </div>

            <div id="weekly-days-editor-container" class="space-y-3"></div>

            <button onclick="window.saveCurrentWeekSchedule()" class="w-full bg-barber-gold text-black font-bold text-xs tracking-widest uppercase py-3 rounded-lg mt-4">
                Guardar Horarios
            </button>
        </div>

    </div>

    <script>
        const DONATO_SUPABASE_URL = 'https://skmeijhahrdovivtqpgo.supabase.co';
        const DONATO_SUPABASE_ANON = 'sb_publishable__qSerIH-2GFNLmx8kOIrHg_GeYy7kib';
        const donatoSupabase = supabase.createClient(DONATO_SUPABASE_URL, DONATO_SUPABASE_ANON);

        const ADMIN_EMAIL = "donato@gmail.com";
        const ADMIN_PASS = "donato2026";

        let config = { weekCustomSchedules: {}, dateExceptions: {}, blockedDates: [] };
        let bookings = [];
        let currentUser = JSON.parse(localStorage.getItem('donato_app_user')) || null;
        let currentEditingWeekState = {};

        window.addEventListener('DOMContentLoaded', async () => {
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.slice(0, 7);
            
            document.getElementById('admin-month-filter').value = currentMonth;
            document.getElementById('admin-week-month').value = currentMonth;

            if (currentUser && currentUser.email === ADMIN_EMAIL) {
                showDashboard();
                await loadDataAndRender();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('login-screen').classList.add('flex');
            }
        });

        window.loadDataAndRender = async function() {
            try {
                // CORREGIDO A donato_settings
                const { data: settingsData } = await donatoSupabase.from('donato_settings').select('value').eq('key', 'main_config').single();
                if (settingsData && settingsData.value) config = settingsData.value;

                // CORREGIDO A donato_bookings
                const { data: bookingsData } = await donatoSupabase.from('donato_bookings').select('*');
                if (bookingsData) {
                    bookings = bookingsData.map(b => ({
                        id: b.id, date: b.date, time: b.time, clientName: b.client_name,
                        clientEmail: b.client_email, clientPhone: b.client_phone, service: b.service, 
                        notes: b.notes, status: b.status
                    }));
                }
                
                renderAdminBookingsTable();
                loadAndRenderWeeklySchedule();
            } catch (err) { console.error("Error cargando base de datos:", err); }
        };

        window.processDirectLogin = function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value.trim().toLowerCase();
            const passInput = document.getElementById('login-password').value;

            if (emailInput === ADMIN_EMAIL.toLowerCase() && passInput === ADMIN_PASS) {
                currentUser = { email: ADMIN_EMAIL };
                localStorage.setItem('donato_app_user', JSON.stringify(currentUser));
                showDashboard();
                loadDataAndRender();
            } else {
                alert("Clave incorrecta.");
            }
        };

        window.logoutAdmin = function() {
            localStorage.removeItem('donato_app_user');
            currentUser = null;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-screen').classList.add('flex');
        };

        function showDashboard() {
            document.getElementById('login-screen').classList.remove('flex');
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        /* ----- CITAS MÓVIL ----- */
        window.renderAdminBookingsTable = function() {
            const container = document.getElementById('admin-bookings-list');
            const stat = document.getElementById('stat-bookings');
            const monthFilter = document.getElementById('admin-month-filter').value;
            container.innerHTML = "";

            let filtered = bookings.filter(b => b.date && b.date.startsWith(monthFilter));
            stat.innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 text-sm py-4">No hay citas en este mes.</p>`;
                return;
            }

            filtered.sort((a, b) => new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time));

            filtered.forEach(b => {
                const card = document.createElement('div');
                card.className = "bg-black border border-gray-800 rounded-xl p-4 relative";
                
                const fechaFormat = b.date.split('-').reverse().join('/');

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="font-bold text-white text-base">${b.clientName}</h4>
                            <p class="text-barber-gold font-mono text-sm">${fechaFormat} a las ${b.time}</p>
                        </div>
                        <button onclick="window.deleteBooking('${b.id}')" class="text-gray-600 hover:text-danger p-2">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="text-xs text-gray-400 space-y-1 mt-3">
                        <p><i class="fa-solid fa-phone w-4 text-center"></i> <a href="https://wa.me/${b.clientPhone.replace(/\s+/g, '').replace('+', '')}" target="_blank" class="text-white underline">${b.clientPhone}</a></p>
                        <p><i class="fa-solid fa-scissors w-4 text-center"></i> ${b.service || 'Corte Standard'}</p>
                        ${b.notes ? `<p class="italic text-gray-500 mt-2 bg-gray-900 p-2 rounded">"${b.notes}"</p>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.deleteBooking = async function(id) {
            if (confirm("¿Eliminar esta cita?")) {
                bookings = bookings.filter(b => b.id !== id);
                renderAdminBookingsTable();
                // CORREGIDO A donato_bookings
                await donatoSupabase.from('donato_bookings').delete().eq('id', id);
            }
        };

        /* ----- HORARIOS MÓVIL ----- */
        function getDatesForWeek(yearMonth, weekNum) {
            const [year, month] = yearMonth.split('-').map(Number);
            let firstDay = new Date(year, month - 1, 1);
            let dayOfWeek = firstDay.getDay();
            let diffToMonday = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
            firstDay.setDate(firstDay.getDate() + diffToMonday);

            let weekStart = new Date(firstDay);
            weekStart.setDate(weekStart.getDate() + (weekNum - 1) * 7);

            let dates = [];
            for (let i = 0; i < 7; i++) {
                let d = new Date(weekStart);
                d.setDate(d.getDate() + i);
                dates.push({ 
                    dateStr: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
                    dayName: ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'][d.getDay()],
                    dayNum: d.getDate()
                });
            }
            return dates;
        }

        window.loadAndRenderWeeklySchedule = function() {
            const monthVal = document.getElementById('admin-week-month').value;
            const weekVal = parseInt(document.getElementById('admin-week-number').value);
            if (!monthVal) return;

            const weekKey = `${monthVal}-W${weekVal}`;
            if (!config.weekCustomSchedules) config.weekCustomSchedules = {};

            currentEditingWeekState = JSON.parse(JSON.stringify(config.weekCustomSchedules[weekKey] || {}));
            window.paintWeeklyScheduleUI();
        };

        window.paintWeeklyScheduleUI = function() {
            const container = document.getElementById('weekly-days-editor-container');
            const monthVal = document.getElementById('admin-week-month').value;
            const weekVal = parseInt(document.getElementById('admin-week-number').value);
            container.innerHTML = "";

            const weekDates = getDatesForWeek(monthVal, weekVal);

            weekDates.forEach(({ dateStr, dayName, dayNum }) => {
                if (!currentEditingWeekState[dateStr]) currentEditingWeekState[dateStr] = { active: false, slots: [] };
                const dayState = currentEditingWeekState[dateStr];

                const card = document.createElement('div');
                card.className = "bg-black border border-gray-800 rounded-lg p-3";

                let slotsHtml = dayState.slots.map((s, idx) => `
                    <span class="inline-flex items-center gap-1 bg-gray-900 border border-gray-700 text-[10px] px-2 py-1 rounded">
                        ${s} <button onclick="window.removeSlot('${dateStr}', ${idx})" class="text-danger font-bold ml-1">×</button>
                    </span>
                `).join('');

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-sm">${dayName} ${dayNum}</span>
                        <div class="flex gap-2">
                            <button onclick="window.addSlot('${dateStr}')" class="text-xs bg-gray-800 px-3 py-1 rounded">+ Hora</button>
                            <button onclick="window.toggleDay('${dateStr}')" class="text-[10px] font-bold px-2 py-1 rounded ${dayState.active ? 'bg-barber-gold text-black' : 'text-gray-500 border border-gray-800'}">
                                ${dayState.active ? 'ACTIVO' : 'INACTIVO'}
                            </button>
                        </div>
                    </div>
                    ${dayState.active ? `<div class="flex flex-wrap gap-2 mt-3">${slotsHtml}</div>` : ''}
                `;
                container.appendChild(card);
            });
        };

        window.toggleDay = function(dateStr) {
            currentEditingWeekState[dateStr].active = !currentEditingWeekState[dateStr].active;
            window.paintWeeklyScheduleUI();
        };

        window.addSlot = function(dateStr) {
            currentEditingWeekState[dateStr].active = true;
            const time = prompt(`Horario para el ${dateStr} (Ej: 15:30):`);
            if (time && time.trim() !== "" && !currentEditingWeekState[dateStr].slots.includes(time.trim())) {
                currentEditingWeekState[dateStr].slots.push(time.trim());
                currentEditingWeekState[dateStr].slots.sort();
            }
            window.paintWeeklyScheduleUI();
        };

        window.removeSlot = function(dateStr, idx) {
            currentEditingWeekState[dateStr].slots.splice(idx, 1);
            window.paintWeeklyScheduleUI();
        };

        window.saveCurrentWeekSchedule = async function() {
            const monthVal = document.getElementById('admin-week-month').value;
            const weekVal = parseInt(document.getElementById('admin-week-number').value);
            const weekKey = `${monthVal}-W${weekVal}`;
            
            config.weekCustomSchedules[weekKey] = JSON.parse(JSON.stringify(currentEditingWeekState));
            // CORREGIDO A donato_settings
            await donatoSupabase.from('donato_settings').upsert({ key: 'main_config', value: config }, { onConflict: 'key' });
            alert(`Semana ${weekVal} guardada con éxito.`);
        };
    </script>
</body>
</html>
